[package]
name = "nebula-launcher"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
fs2 = "0.4"
nebula-core = { path = "../crates/nebula-core" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }

[dev-dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
