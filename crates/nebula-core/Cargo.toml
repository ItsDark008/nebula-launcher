[package]
name = "nebula-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
serde_json = "1.0.154"
